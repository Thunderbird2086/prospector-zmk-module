# Enable BLE features
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# CONFIG_ZMK_BLE_CONN_PER_EP=1

# Increase timeouts for better reliability
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_PRIORITY=5

# Enable USB stack for proper switching
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y_Z_MEM_POOL_SIZE=10000
# CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

